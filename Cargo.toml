# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-aws"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws"
description = "What every AWS technology speaks over HTTP: Signature Version 4, the Query API and the JSON 1.1 protocol, both sides of each. Not a transport of its own: s3, aws-sqs, aws-sns and aws-kinesis ride on it. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the error vocabulary and the XML reader.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# What AWS speaks rides on HTTP: the request and its answer, the judgement
# of an answer.
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# Percent-encoding (RFC 3986), written once for the estate, and the
# request and answer the signer and the protocols form (`net::http`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# XML character data escaped, a digest written as hex, and the civil
# calendar x-amz-date is written off.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

# Signature Version 4 is SHA-256 and HMAC-SHA256; the HMAC's own check is
# the constant-time comparison. Pure Rust and small.
sha2 = "0.10"
hmac = "0.12"
# The JSON 1.1 protocol's documents.
serde_json = "1"

[dev-dependencies]

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
