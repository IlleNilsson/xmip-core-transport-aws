[package]
name = "xmip-core-transport-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws"
description = "What every AWS technology speaks over HTTP: Signature Version 4, the Query API and the JSON 1.1 protocol, both sides of each. Not a transport of its own: aws-s3, aws-sqs, aws-sns and aws-kinesis ride on it. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the error vocabulary and the XML reader.
transport = { workspace = true, optional = true }
# What AWS speaks rides on HTTP: the request and its answer, the judgement
# of an answer.
http = { workspace = true, optional = true }
# Percent-encoding (RFC 3986), written once for the estate, and the
# request and answer the signer and the protocols form (`net::http`).
net = { workspace = true, optional = true }
# XML character data escaped, Signature Version 4's SHA-256 and
# HMAC-SHA256, its check in constant time (codec::digest), the digest
# written as hex, and the civil calendar x-amz-date is written off.
codec = { workspace = true, optional = true }
# The one clock (`xcore::Clock`), which x-amz-date is read from, and the
# settings declaration `access_key_id` is written in (`xcore::settings`).
xcore = { workspace = true }

# The JSON 1.1 protocol's documents.
serde_json = { version = "1", optional = true }

[dev-dependencies]

[features]
# What AWS speaks, and the declaration: the transport guide's "The
# declaration", module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:transport", "dep:http", "dep:net", "dep:codec", "dep:serde_json"]
# The declaration alone: the setting every AWS technology declares,
# `access_key_id` (`access_key::ACCESS_KEY_ID`), which a technology's own
# declaration takes.
declaration = []

[lints]
workspace = true
