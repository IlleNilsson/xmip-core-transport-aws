[package]
name = "xmip-core-transport-aws"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws"
description = "What every AWS technology speaks over HTTP: Signature Version 4, the Query API and the JSON 1.1 protocol, both sides of each. Not a transport of its own: aws-s3, aws-sqs, aws-sns and aws-kinesis ride on it. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the error vocabulary and the XML reader.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", optional = true }
# What AWS speaks rides on HTTP: the request and its answer, the judgement
# of an answer.
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# Percent-encoding (RFC 3986), written once for the estate, and the
# request and answer the signer and the protocols form (`net::http`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# XML character data escaped, Signature Version 4's SHA-256 and
# HMAC-SHA256, its check in constant time (codec::digest), the digest
# written as hex, and the civil calendar x-amz-date is written off.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The one clock (`xcore::Clock`), which x-amz-date is read from, and the
# settings declaration `access_key_id` is written in (`xcore::settings`).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The JSON 1.1 protocol's documents.
serde_json = { version = "1", optional = true }

[dev-dependencies]

[features]
# What AWS speaks and everything it is built on, and the declaration.
# Without it the crate is the declaration alone (ADR-0064, amendments
# 2026-10-22 and 2026-11-26).
default = ["declaration", "dep:transport", "dep:http", "dep:net", "dep:codec", "dep:serde_json"]
# The declaration alone: the setting every AWS technology declares,
# `access_key_id` (`access_key::ACCESS_KEY_ID`), and none of the code — what
# a technology's own declaration takes, and the surfaces' library is to
# carry (open problem 48).
declaration = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
